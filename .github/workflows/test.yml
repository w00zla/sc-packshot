name: Tests

# Every pull request (and by hand): the Rust tests (fake tools, no game data) on Linux and Windows, clippy, and
# shellcheck for the shell scripts. The ruleset on main requires these checks; main changes only through pull
# requests, so a run after the merge would test the same code twice (ADR 0050).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.platform }}
          # saved per pull request (its later pushes read it): no main run fills a shared one (ADR 0050)
      - name: cargo test
        run: cargo test --release --locked
      - name: cargo clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh scripts/lib/*.sh templates/bundle/linux/*.sh
