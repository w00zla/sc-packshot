# Pinned external tools: the dev setup (scripts/setup.*), the StarBreaker build (scripts/starbreaker-build.*), the
# bundles (scripts/packshot-bundle.*) and packshot itself in a checkout use exactly these. Change a pin here, then
# run scripts/setup.* again. Plain `key = "value"` lines only (the scripts read them without a TOML library).

[blender]
version = "5.2.3"
# SHA256 of the official archives (download.blender.org/release/Blender<major.minor>/blender-<version>.sha256)
sha256-windows-x64 = "723f08a4401502561eb763cdeacf8745b31e5f3f154d287d3830d97cf75dc2fb"
sha256-linux-x64 = "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec"

[starbreaker]
# The fork's release (ADR 0026): its files from <url>/releases/download/<release>/, checked against these SHA256 (the
# release's SHA256SUMS); commit is the commit it was built from, what the nodes compare
url = "https://github.com/w00zla/starbreaker-ps"
release = "0.3.2-ps.6"
commit = "aa0ad09f1a44cfb924e3c5d71cc1b301ded69377"
sha256-windows-x64 = "96dec73fd2ac9c79afc410fd5c9a084d1c182841f7c1f84d9f038f4ef41f6bb6"
sha256-linux-x64 = "2d9210c11f6a100b0e8a227a5be00bdde3c0a643aafbfcf359138c1104e8ea6a"
sha256-addon = "46ccd1025a25628cd2f78c0c670ef14292dd2e25ccf7ef125cbc84cb4d3931bc"
# fork development only (scripts/setup.ps1 -FromSource / scripts/setup.sh --from-source, scripts/starbreaker-build.*): the checkout next to this repository
repo = "../starbreaker-ps"
