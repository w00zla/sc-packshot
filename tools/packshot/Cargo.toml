[package]
name = "packshot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_128"] }

[profile.release]
debug = false
